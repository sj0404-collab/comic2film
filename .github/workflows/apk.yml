name: Build APK

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint + tests
        run: npm run check && npm test

      - name: Build www
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore release keystore from secrets
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/voicecomic-release.jks
          {
            echo 'STORE_FILE=../keystore/voicecomic-release.jks'
            echo 'STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}'
            echo 'KEY_ALIAS=${{ secrets.KEY_ALIAS }}'
            echo 'KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}'
          } > android/keystore.properties
          node tools/patch-signing.mjs

      - name: Build signed release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          mv "$APK" "voicecomic-$TAG.apk"
          NOTES=$(printf '%s\n' \
            "Сборка в GitHub Actions по тегу $TAG." \
            "" \
            "**Что нового в $VERSION:**" \
            "- OpenCode Zen вернулся как **реальный провайдер** (шлюз opencode.ai/zen): один ключ → любые модели, звёздочкой помечены бесплатные (qwen3.6-plus-free, kimi-k2.5-free, glm-5-free, minimax-m2.5-free, deepseek-v4-flash-free);" \
            "- во вкладке Zen — ссылка «📚 Список моделей Zen →» и можно вписать **любую** модель вручную (каталог Zen обновляется на их сайте);" \
            "- сам каталог моделей Zen больше не раздувается автообновляемой копией из models.dev — стабильный curated-список;" \
            "- устаревший провайдер opencode-go оставлен удалённым." \
            "" \
            "**Ранее в 1.1.0:** новый пикер моделей (вкладки + дерево + фильтры 🆓/платно/vision/умные/быстрые/оркестратор), ссылки «где взять ключ», живая проверка ⚡, новая обложка." \
            "" \
            "**APK (release-signed):** voicecomic-$TAG.apk" \
            "" \
            "**Проверено:** npm test — ALL PASS; endpoint zen отвечает (401 на неверный ключ = реальный шлюз); бесплатные модели без ключей (Pollinations) отвечают вживую.")
          gh release create "$TAG" "voicecomic-$TAG.apk" \
            --target "${GITHUB_SHA}" \
            --title "VoiceComic $VERSION — OpenCode Zen вернулся (реальный шлюз, любые модели)" \
            --notes "$NOTES"