name: Build APK on tag

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint + tests
        run: npm run check && npm test

      - name: Build www
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Start cloudflared tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared tunnel --url http://localhost:8000 --no-autoupdate > tunnel.log 2>&1 &
          echo "Tunnel PID: $!"
          sleep 5
          TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' tunnel.log | head -1)
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "Tunnel URL: $TUNNEL_URL"

      - name: Start backend
        env:
          VOICECOMIC_WORKSPACE: ${{ runner.temp }}/voicecomic-workspace
          PORT: 8000
        run: |
          mkdir -p ${{ runner.temp }}/voicecomic-workspace
          cd backend
          python main.py > backend.log 2>&1 &
          echo "Backend PID: $!"
          sleep 3
          curl -s http://localhost:8000/health

      - name: Inject tunnel URL into app config
        if: env.TUNNEL_URL != ''
        run: |
          echo "window.__VOICECOMIC_TUNNEL__ = '${TUNNEL_URL}';" > www/js/tunnel-config.js
          echo "Tunnel config written"

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          VERSION="${GITHUB_REF_NAME#v}"
          mv "$APK" "voicecomic-$GITHUB_REF_NAME.apk"
          NOTES=$(printf '%s\n' \
            "Сборка в GitHub Actions по git-тегу $GITHUB_REF_NAME." \
            "" \
            "**Что нового:** полный каталог ИИ-провайдеров и моделей opencode (models.dev, 198 провайдеров / 6188 моделей), удалён фейковый Zen AI, багфиксы рендера (resample Edge 24→44.1кГц), нарезки голосов и индекса каталога." \
            "" \
            "**APK (debug-sign):** voicecomic-$GITHUB_REF_NAME.apk")
          gh release create "$GITHUB_REF_NAME" "voicecomic-$GITHUB_REF_NAME.apk" \
            --title "VoiceComic $VERSION — все провайдеры opencode (models.dev)" \
            --notes "$NOTES"