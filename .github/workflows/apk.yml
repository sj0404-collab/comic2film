name: Build APK

on:
  push:
    # ветка с нативным переносом — пока не влита в main, но собрать подписанный APK надо
    branches: ['main', 'native-rewrite']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 2.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: node tools/set-version.mjs "${{ inputs.version }}"

      - name: Restore release keystore from secrets
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/voicecomic-release.jks
          {
            echo 'STORE_FILE=keystore/voicecomic-release.jks'
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          VERSION=$(grep '^voicecomic.versionName=' gradle.properties | cut -d= -f2)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
          fi
          mv "$APK" "voicecomic-$TAG.apk"
          NOTES=$(git log --no-merges --pretty=format:'* %s' "$(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~20)"..HEAD | head -40)
          gh release create "$TAG" "voicecomic-$TAG.apk" \
            --target "${GITHUB_SHA}" \
            --title "VoiceComic $VERSION — нативный Android" \
            --notes "Нативная версия: Kotlin + Jetpack Compose, без WebView.

**Что нового в $VERSION:**
$NOTES

**APK (release-signed):** voicecomic-$TAG.apk"
