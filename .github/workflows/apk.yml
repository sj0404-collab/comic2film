name: Build APK

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint + tests
        run: npm run check && npm test

      - name: Build www
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore release keystore from secrets
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/voicecomic-release.jks
          {
            echo 'STORE_FILE=../keystore/voicecomic-release.jks'
            echo 'STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}'
            echo 'KEY_ALIAS=${{ secrets.KEY_ALIAS }}'
            echo 'KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}'
          } > android/keystore.properties
          node tools/patch-signing.mjs

      - name: Build signed release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          mv "$APK" "voicecomic-$TAG.apk"
          NOTES=$(printf '%s\n' \
            "Сборка в GitHub Actions по тегу $TAG." \
            "" \
            "**Что нового в $VERSION:**" \
            "- **+2 новые демо-модели Zen без ключа (проверено вживую):** muse-spark-1.3-contributor-free и muse-spark-1.2-contributor-free — ответы через эндпоинт /v1/responses с тулами в Responses-формате; релей автоматически сворачивает их в обычный chat.completion;" \
            "- добавлена deepseek-v4-flash-free (зарегистрирована в free tier, но провайдер временно отдаёт «Model is unavailable»);" \
            "- итого 10 демо-моделей Zen без ключа + 5 моделей Pollinations = 15 ключевых «без API» -кандидатов в фильтре «🆓 без ключа»;" \
            "- «Ox Alpha» (x-preview-f-free) анонимно больше не отдаётся (401) — его роль выполняют Muse Spark; jev-1.13-free — decision-модель (state+questions), не чат, в чат не включена;" \
            "- релей relay/zen-relay.mjs теперь понимает оба эндпоинта zen (chat + responses) с автоопределением по модели и понятными ошибками (jev)." \
            "" \
            "**Ранее:** 1.1.4 — базовые демо-модели Zen (big-pickle, mimo-*, nemotron-*, ling-3.0-flash-fin-free, space-bunny-free) через релей. 1.1.3 — живой тест всех моделей каталога. 1.1.2 — пикер по умолчанию с фильтром «без ключа». 1.1.1 — OpenCode Zen вернулся как реальный провайдер (opencode.ai/zen)." \
            "" \
            "**APK (release-signed):** voicecomic-$TAG.apk")
          gh release create "$TAG" "voicecomic-$TAG.apk" \
            --target "${GITHUB_SHA}" \
            --title "VoiceComic $VERSION — +2 демо-модели Zen (Muse Spark), 10 Zen + 5 Pollinations без ключа" \
            --notes "$NOTES"