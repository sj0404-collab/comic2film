name: Build APK

on:
  push:
    # ветка с нативным переносом — пока не влита в main, но собрать подписанный APK надо
    branches: ['main', 'native-rewrite']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 2.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    # ubuntu-latest уезжает на Ubuntu 26 19.10.2026; pin, чтобы сборка
    # релиза не поехала из-за смены образа в середине цикла
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # заголовок релиза и имя APK собираются из gradle.properties, поэтому
      # пуш тега, не совпадающего с версией в файле, выпустил бы релиз
      # «VoiceComic 2.0.2» под тегом v2.0.3 — молча и уже после сборки
      - name: Проверить, что тег совпадает с версией
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep '^voicecomic.versionName=' gradle.properties | cut -d= -f2)
          if [ "$VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::тег ${{ github.ref_name }} не совпадает с voicecomic.versionName=$VERSION в gradle.properties"
            echo "::error::поставь версию (node tools/set-version.mjs ${{ github.ref_name }}), запушь и только потом ставь тег"
            exit 1
          fi

      # веб-версия осталась в legacy-web/ и её правки (чат, релей, вкладки)
      # больше ничем не проверяются: смоук-тесты переехали вместе с ней
      - name: Legacy web smoke tests
        run: node legacy-web/tests/smoke.mjs

      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/set-version.mjs "${{ inputs.version }}"
          VERSION=$(grep '^voicecomic.versionName=' gradle.properties | cut -d= -f2)
          # падать сразу, а не в финальном шаге после сборки: gh release create
          # на уже существующем теге/релизе даёт невнятную ошибку, и за
          # два-три минуты сборки выясняется, что версия уже выпущена
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::тег v$VERSION уже есть в origin — задай версию выше (сейчас в gradle.properties $VERSION)"
            exit 1
          fi

      - name: Restore release keystore from secrets
        id: signing
        run: |
          if [ -z "${{ secrets.STORE_PASSWORD }}" ]; then
            echo "⚠️ секрет STORE_PASSWORD пуст — подписанную сборку сделать нельзя,"
            echo "   будет unsigned APK. Верни секрет: gh secret set STORE_PASSWORD"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/voicecomic-release.jks
          {
            echo 'STORE_FILE=keystore/voicecomic-release.jks'
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          VERSION=$(grep '^voicecomic.versionName=' gradle.properties | cut -d= -f2)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # подстраховка от тихого перезатирания: релиз, созданный вручную
          # или другим запуском, не затираем молча
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::релиз $TAG уже существует — перезатирать его не буду. Собери новую версию."
            exit 1
          fi
          mv "$APK" "voicecomic-$TAG.apk"
          {
            echo "Нативная версия: Kotlin + Jetpack Compose, без WebView."
            echo
            echo "Что нового в $VERSION:"
            # предыдущий тег ищем от родителя HEAD: при пуше тега сам тег иначе
            # попадёт в диапазон и список изменений выйдет пустым
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~20)
            git log --no-merges --pretty=format:'* %s' "$PREV"..HEAD | head -40
            echo
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "APK (release-signed): voicecomic-$TAG.apk"
            else
              echo "APK (UNSIGNED — секрет STORE_PASSWORD пуст): voicecomic-$TAG.apk"
            fi
          } > notes.md
          gh release create "$TAG" "voicecomic-$TAG.apk" \
            --target "${GITHUB_SHA}" \
            --title "VoiceComic $VERSION — нативный Android" \
            --notes-file notes.md
