name: Build APK on tag

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint + tests
        run: npm run check && npm test

      - name: Build www
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          VERSION="${GITHUB_REF_NAME#v}"
          mv "$APK" "voicecomic-$GITHUB_REF_NAME.apk"
          NOTES=$(printf '%s\n' \
            "Сборка в GitHub Actions по git-тегу $GITHUB_REF_NAME." \
            "" \
            "**Что нового:** чат с ИИ (сессии, файлы), PTY терминал (xterm.js), FastAPI бэкенд с GitHub PAT авторизацией, YOLOv8 model picker (n/s/m/l/x + custom), cloudflared туннель настраивается пользователем." \
            "" \
            "**APK (debug-sign):** voicecomic-$GITHUB_REF_NAME.apk")
          gh release create "$GITHUB_REF_NAME" "voicecomic-$GITHUB_REF_NAME.apk" \
            --title "VoiceComic $VERSION — чат, терминал, бэкенд, YOLO picker" \
            --notes "$NOTES"